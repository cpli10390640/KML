<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#fff8f1">
<meta name="referrer" content="no-referrer">
<title>ปฏิทินห้องพัก Klin Mali</title>
<style>
:root{color-scheme:light;--bg:#fff8f1;--card:#fff;--ink:#222;--muted:#6f675c;--line:#eadccb;
--in:#13865f;--inSoft:#dff4ea;--out:#d63333;--outSoft:#fde4e4;--wait:#9a6b00;--waitSoft:#fff1c9;
--rep:#5f6368;--repBg:#d9dde1;--repSoft:#eef0f2;--hold:#a55a12;--holdBg:#fbc99a;--holdSoft:#feead6;--err:#c23a3a;--errSoft:#fde3e3;--done:#5f6368;--doneSoft:#eceff1;--brand:#e8892d;--stay:#2f6fb5;--stayBg:#f1f6fc;--free:#e6dfd3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;font-size:18px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 100px}
header{padding:16px 4px 6px}
h1{font-size:22px;margin:0;color:#a85512}
.sub{font-size:14px;color:var(--muted)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.mnav button{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:26px;color:var(--ink)}
.mnav .t{font-size:22px;font-weight:800}
.todaybtn{display:block;margin:0 auto;font:inherit;font-size:16px;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 18px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:15px;color:var(--muted);margin:10px 0 4px}
.legend i{display:inline-block;width:20px;height:16px;border-radius:5px;vertical-align:-2px;margin-right:6px}
.cal{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:15px;font-weight:700;color:var(--muted);padding:4px 0}
.dow.sun{color:var(--out)}
.cell{min-width:0;min-height:84px;border:0;border-radius:12px;background:none;font:inherit;color:var(--ink);padding:4px 0 0;display:flex;flex-direction:column;align-items:center}
.cell .n{font-size:20px;font-weight:700;line-height:1.2}
.cell.today .n{color:#fff;background:var(--ink);border-radius:50%;width:32px;height:32px;line-height:32px}
.cell.sel{outline:3px solid var(--brand);outline-offset:-1px}
.cell.busy{background:var(--stayBg)}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:92%;margin-top:5px}
.b{height:22px;border-radius:4px;background:var(--free)}
.b.in{background:var(--in)}.b.out{background:var(--out)}.b.stay{background:var(--stay)}
.b.turn{background:linear-gradient(90deg,var(--out) 50%,var(--in) 50%)}
.b.rep{background:repeating-linear-gradient(45deg,#b9bec4 0 4px,#e3e6e9 4px 8px)}.b.hold{background:var(--holdBg)}
.use{font-size:13px;font-weight:800;color:var(--stay);margin-top:3px;line-height:1.3}
.use.none{color:#a49a8a;font-weight:600}.use.full{color:#fff;background:var(--out);border-radius:6px;padding:0 6px}
.key{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0}
.key .row{display:flex;align-items:center;gap:12px}
.key .bars{width:150px;margin:0;flex:0 0 auto}.key .b{height:26px;font-size:13px;line-height:26px;color:#fff;font-weight:800;text-align:center}
.key .b.free{color:#8a8172}
.key .txt{font-size:15px;line-height:1.4}
.key .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:15px;color:var(--ink);margin:10px 0 0;justify-content:start}
.t-hold{background:var(--holdSoft);color:var(--hold)}
.detail{margin-top:16px}
.dtitle{font-size:22px;font-weight:800;margin:0 4px 10px}
.dtitle small{display:block;font-size:15px;font-weight:600;color:var(--muted)}
.room{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.room h3{margin:0 0 4px;font-size:19px}
.free{color:var(--muted);font-size:17px}
.ev{padding:8px 0}
.ev+.ev{border-top:1px dashed var(--line)}
.line1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{border-radius:12px;padding:4px 12px;font-weight:800;font-size:18px}
.t-in{background:var(--inSoft);color:var(--in)}.t-out{background:var(--outSoft);color:var(--out)}.t-mid{background:var(--doneSoft);color:var(--done)}
.who{font-size:19px;font-weight:700}
.name{margin-top:6px;font-size:18px;display:flex;gap:6px;min-width:0}
.name .v{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lb{color:var(--muted);font-weight:600;flex:0 0 auto}
.row2{margin-top:4px;font-size:16px;display:flex;gap:8px;align-items:center}
.dates{margin-top:4px;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line2{font-size:15px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.st{font-size:14px;font-weight:700;border-radius:999px;padding:2px 10px}
.s-in{background:var(--inSoft);color:var(--in)}.s-out{background:var(--doneSoft);color:var(--done)}.s-wait{background:var(--waitSoft);color:var(--wait)}.s-rep{background:var(--repSoft);color:var(--rep)}.s-other{background:var(--doneSoft);color:var(--ink)}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));border:0;font-family:inherit;background:var(--brand);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(232,137,45,.35);cursor:pointer}
.note{font-size:13px;color:var(--muted);margin-top:22px;line-height:1.6;text-align:center}
.err{background:var(--errSoft);color:var(--err);border-radius:12px;padding:10px 14px;font-size:15px;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌼 Klin Mali Resort</h1>
    <div class="sub" id="src">กำลังโหลดข้อมูล…</div>
  </header>
  <div id="msg"></div>
  <div class="mnav">
    <button id="prev" aria-label="เดือนก่อน">‹</button>
    <div class="t" id="mt"></div>
    <button id="next" aria-label="เดือนถัดไป">›</button>
  </div>
  <button class="todaybtn" id="tdy">กลับมาวันนี้</button>
  <div class="key">
    <div class="row"><div class="bars"><i class="b stay">1</i><i class="b free">2</i><i class="b in">3</i><i class="b free">4</i><i class="b free">5</i></div>
      <div class="txt">แถบ 5 ช่อง = <b>ห้อง 1–5</b><br>เรียงจากซ้ายไปขวา</div></div>
    <div class="legend">
      <span><i style="background:var(--in)"></i>Check in</span>
      <span><i style="background:var(--stay)"></i>มีคนพักอยู่</span>
      <span><i style="background:var(--out)"></i>Check out</span>
      <span><i style="background:var(--free)"></i>ห้องว่าง</span>
      <span><i style="background:repeating-linear-gradient(45deg,#b9bec4 0 4px,#e3e6e9 4px 8px)"></i>รอซ่อม</span>
      <span><i style="background:var(--holdBg)"></i>วันหยุด/ปิดห้อง</span>
    </div>
  </div>
  <div class="cal"><div class="grid" id="grid"></div></div>
  <div class="detail" id="detail"></div>
  <p class="note">“พัก X” = จำนวนห้องที่มีแขกพักคืนนั้น · แตะวันที่เพื่อดูว่าใครเข้า–ออกกี่โมง<br>อัปเดตเองทุก 1 นาที (Google อาจหน่วงประมาณ 5 นาทีหลังแก้ชีต)</p>
</div>
<button class="fab" id="reload">🔄 อัปเดต</button>
<script>
"use strict";
/* ===== ตั้งค่า: ลิงก์ CSV ของแท็บที่ Publish to web (ควรเป็นแท็บที่ไม่มีเบอร์โทร) ===== */
const SHEET_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vR4WjAy59hgSZzj8-xfLkBk8cJS0r536GZR1Xhye6ZKg8GLkuj8SitvT1Z9nHL6gsWU8SYZD8nW-6mI/pub?gid=1130178007&single=true&output=csv";
const REFRESH_MS=60*1000;

const ROOMS=["มะลิฉัตร","มะลิลา","มะลิซ้อน","มะลิวัลย์","มะลิจันทร์"];
const TH_M=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const TH_S=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const DOWS=["อา","จ","อ","พ","พฤ","ศ","ส"];
const DOWL=["วันอาทิตย์","วันจันทร์","วันอังคาร","วันพุธ","วันพฤหัสบดี","วันศุกร์","วันเสาร์"];

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const parseKey=k=>{const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c);};
const shortDate=k=>{const d=parseKey(k);return `${d.getDate()} ${TH_S[d.getMonth()]}`;};
const now=new Date(), TODAY=key(now.getFullYear(),now.getMonth(),now.getDate());
let cur={y:now.getFullYear(),m:now.getMonth()}, sel=TODAY;
let BOOKINGS=[];   // {name, status, people, room(0-4), inK, inT, outK, outT}

/* ---------- สถานะ ---------- */
function statusInfo(s){
  const t=String(s||"").toLowerCase().replace(/\s/g,"");
  if(t.includes("check-in")||t==="checkin") return {cls:"s-in",label:"กำลังเข้าพัก"};
  if(t.includes("check-out")||t==="checkout") return {cls:"s-out",label:"ออกแล้ว"};
  if(t.includes("รอเข้าพัก")) return {cls:"s-wait",label:"รอเข้าพัก"};
  if(t.includes("ซ่อม")) return {cls:"s-rep",label:"รอซ่อม"};
  return {cls:"s-other",label:s||"ไม่ระบุสถานะ"};
}

const isHold=b=>/วันหยุด|ปิดห้อง|ปิดรีสอร์ท/.test(b.name+" "+b.status);
/* ---------- ปฏิทิน ---------- */
function onDay(b,k){return b.inK<=k&&k<=b.outK;}
/* สถานะของแต่ละห้องในวันนั้น: hold > rep > turn > in > stay > out > free */
function roomState(r,k){
  let inn=false,out=false,stay=false,rp=false,hd=false;
  BOOKINGS.forEach(b=>{
    if(b.room!==r||!onDay(b,k)) return;
    if(isHold(b)){hd=true;return;}
    if(statusInfo(b.status).cls==="s-rep"){rp=true;return;}
    if(b.inK===k) inn=true;
    else if(b.outK===k) out=true;
    else stay=true;
  });
  if(hd) return "hold"; if(rp) return "rep";
  if(inn&&out) return "turn"; if(inn) return "in"; if(stay) return "stay"; if(out) return "out";
  return "free";
}
function renderCal(){
  document.getElementById("mt").textContent=`${TH_M[cur.m]} ${cur.y+543}`;
  const first=new Date(cur.y,cur.m,1).getDay(), days=new Date(cur.y,cur.m+1,0).getDate();
  let h=DOWS.map((d,i)=>`<div class="dow ${i===0?"sun":""}">${d}</div>`).join("");
  for(let i=0;i<first;i++) h+="<div></div>";
  for(let d=1;d<=days;d++){
    const k=key(cur.y,cur.m,d), st=ROOMS.map((_,r)=>roomState(r,k));
    const guests=st.filter(s=>s==="in"||s==="stay"||s==="turn").length;
    const blocked=guests+st.filter(s=>s==="rep"||s==="hold").length;
    const bars=st.map((s,r)=>`<i class="b ${s}" title="ห้อง ${r+1}"></i>`).join("");
    const lab=blocked===5?`<span class="use full">เต็ม</span>`:guests?`<span class="use">พัก ${guests}</span>`:`<span class="use none">ว่าง</span>`;
    h+=`<button class="cell ${guests?"busy":""} ${k===TODAY?"today":""} ${k===sel?"sel":""}" data-k="${k}" aria-label="${d} ${TH_M[cur.m]}"><span class="n">${d}</span><span class="bars">${bars}</span>${lab}</button>`;
  }
  document.getElementById("grid").innerHTML=h;
}
function renderDetail(){
  const dt=parseKey(sel);
  let h=`<div class="dtitle">${DOWL[dt.getDay()]}ที่ ${dt.getDate()} ${TH_M[dt.getMonth()]} ${dt.getFullYear()+543}${sel===TODAY?"<small>วันนี้</small>":""}</div>`;
  ROOMS.forEach((r,i)=>{
    const list=BOOKINGS.filter(b=>b.room===i&&onDay(b,sel))
      .sort((a,b)=>(a.outK===sel?0:a.inK===sel?2:1)-(b.outK===sel?0:b.inK===sel?2:1));
    h+=`<div class="room"><h3>ห้อง ${i+1} · ${esc(r)}</h3>`;
    if(!list.length) h+=`<div class="free">ว่าง</div>`;
    list.forEach(b=>{
      if(isHold(b)){
        h+=`<div class="ev"><div class="line1"><span class="tag t-hold">วันหยุด</span><span class="who">${/^\s*วันหยุด\s*$/.test(b.name)?"ปิดห้อง":esc(b.name)}</span></div>
          <div class="line2"><span>${shortDate(b.inK)} ${esc(b.inT)} → ${shortDate(b.outK)} ${esc(b.outT)}</span></div></div>`;
        return;
      }
      const st=statusInfo(b.status);
      if(st.cls==="s-rep"){
        h+=`<div class="ev"><div class="line1"><span class="tag t-mid">รอซ่อม</span></div>
          <div class="name"><span class="lb">รายการ :</span><span class="v">${esc(b.name)}</span></div>
          <div class="dates">${shortDate(b.inK)} ${esc(b.inT)} → ${shortDate(b.outK)} ${esc(b.outT)}</div></div>`;
        return;
      }
      let tag;
      if(b.outK===sel&&b.inK!==sel) tag=`<span class="tag t-out">Check out ${esc(b.outT||"-")}</span>`;
      else if(b.inK===sel) tag=`<span class="tag t-in">Check in ${esc(b.inT||"-")}</span>`;
      else tag=`<span class="tag t-mid">พักต่อ</span>`;
      h+=`<div class="ev"><div class="line1">${tag}</div>
        <div class="name"><span class="lb">ชื่อผู้เข้าพัก :</span><span class="v">${esc(b.name)}</span></div>
        <div class="row2"><span class="lb">Status :</span><span class="st ${st.cls}">${esc(st.label)}</span></div>
        <div class="dates">${shortDate(b.inK)} ${esc(b.inT)} → ${shortDate(b.outK)} ${esc(b.outT)}${b.people?` · ${esc(b.people)} คน`:""}</div></div>`;
    });
    h+="</div>";
  });
  document.getElementById("detail").innerHTML=h;
}
function render(){renderCal();renderDetail();}
function shift(n){cur.m+=n;if(cur.m<0){cur.m=11;cur.y--;}if(cur.m>11){cur.m=0;cur.y++;}
  sel=(cur.y===now.getFullYear()&&cur.m===now.getMonth())?TODAY:key(cur.y,cur.m,1);render();}
document.getElementById("prev").onclick=()=>shift(-1);
document.getElementById("next").onclick=()=>shift(1);
document.getElementById("tdy").onclick=()=>{cur={y:now.getFullYear(),m:now.getMonth()};sel=TODAY;render();};
document.getElementById("grid").addEventListener("click",e=>{const b=e.target.closest(".cell");if(!b)return;sel=b.dataset.k;render();
  document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"start"});});

/* ---------- อ่าน CSV ---------- */
function parseCSV(t){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(f);f="";}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";}else if(c!=='\r')f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}return rows;}
function parseDMY(s){const m=String(s||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return null;
  let y=+m[3]; if(y>2400) y-=543; return key(y,+m[2]-1,+m[1]);}
function parseTime(s){const m=String(s||"").trim().match(/^(\d{1,2})[:.](\d{2})/);return m?`${pad(+m[1])}:${m[2]}`:"";}
function roomIndex(s){const t=String(s||"");for(let i=0;i<ROOMS.length;i++){if(t.includes(ROOMS[i]))return i;}
  const m=t.match(/^\s*([1-5])\s*\./);return m?+m[1]-1:-1;}
function toBookings(rows){
  // หาแถวหัวตารางจากชื่อคอลัมน์ (ไม่อ่านคอลัมน์เบอร์โทร/ราคา)
  const hi=rows.findIndex(r=>r.some(c=>/check-in date/i.test(c))&&r.some(c=>/status/i.test(c)));
  if(hi<0) throw new Error("ไม่พบหัวตาราง Status / Check-in Date");
  const H=rows[hi].map(c=>String(c).trim().toLowerCase());
  const col=re=>H.findIndex(c=>re.test(c));
  const C={name:col(/ชื่อ/),status:col(/^status$/),people:col(/จำนวนคน/),inD:col(/check-in date/),inT:col(/check-in time/),
           outD:col(/check-out date/),outT:col(/check-out time/),room:col(/^ห้อง$/)};
  ["name","status","inD","outD","room"].forEach(k=>{if(C[k]<0) throw new Error("ไม่พบคอลัมน์ "+k);});
  const out=[];
  rows.slice(hi+1).forEach(r=>{
    const inK=parseDMY(r[C.inD]), outK=parseDMY(r[C.outD]), room=roomIndex(r[C.room]);
    if(!inK||room<0) return;
    out.push({name:String(r[C.name]||"").trim()||"(ไม่ระบุชื่อ)",status:String(r[C.status]||"").trim(),
      people:C.people>=0?String(r[C.people]||"").trim():"",room,inK,inT:C.inT>=0?parseTime(r[C.inT]):"",
      outK:outK&&outK>=inK?outK:inK,outT:C.outT>=0?parseTime(r[C.outT]):""});
  });
  return out;
}

let loading=false,lastOk=null;
async function load(){
  if(loading)return; loading=true;
  const src=document.getElementById("src"), msg=document.getElementById("msg");
  try{
    if(!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(SHEET_CSV)) throw new Error("ยังไม่ได้ใส่ลิงก์ CSV ของชีต");
    const res=await fetch(SHEET_CSV+"&t="+Date.now(),{cache:"no-store",credentials:"omit",referrerPolicy:"no-referrer"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text=await res.text();
    if(text.length>10*1024*1024) throw new Error("ข้อมูลใหญ่เกินไป");
    BOOKINGS=toBookings(parseCSV(text)); lastOk=new Date();
    src.textContent=`ข้อมูลจาก Google Sheets · อัปเดตล่าสุด ${pad(lastOk.getHours())}:${pad(lastOk.getMinutes())} น.`;
    msg.innerHTML=""; render();
  }catch(e){
    msg.innerHTML=`<div class="err">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}</div>`;
    if(lastOk) src.textContent=`อัปเดตล่าสุด ${pad(lastOk.getHours())}:${pad(lastOk.getMinutes())} น.`;
  }finally{loading=false;}
}
document.getElementById("reload").onclick=load;
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});
setInterval(()=>{if(!document.hidden)load();},REFRESH_MS);
render(); load();
</script>
</body>
</html>
